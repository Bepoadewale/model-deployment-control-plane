name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check control-plane/src tests scripts
      - run: python -m pytest -q

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make bootstrap-local
      - run: make demo-release
      - run: make demo-rollback
      - run: make demo-tamper
      - run: make demo-recovery
      - run: make demo-stale
      - run: make verify
      - if: always()
        run: make clean-local
